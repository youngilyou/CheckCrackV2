# Diagnostic-only config for the UAVID3D/Blume test dataset used to smoke-test
# the pipeline mechanics (graph -> warp -> seam -> blend). That dataset is an
# oblique orbit around a building for 3D reconstruction, not a flat facade
# wall (CLAUDE.local.md's actual target scene) — it has real 3D parallax
# (roofline, ground, adjacent walls all in frame at gimbal pitch ~-42deg), so
# a single global homography per pair only explains a fraction of matches by
# design. min_inlier_ratio is relaxed here to let a homography still pass
# when median reprojection error is low (see pipeline.log), NOT because the
# geometry is untrustworthy. Do not use these thresholds for real facade
# flights — config/pipeline.yaml's defaults are what real (planar) facade
# captures should be checked against.

project:
  building_id: B001

facade_segmentation:
  merge_if_normal_angle_delta_deg: 8
  split_if_normal_angle_delta_deg: 15
  min_segment_length_m: 2.0

facade_assignment:
  max_camera_to_target_angle_deg: 25
  corner_duplicate_angle_deg: 35
  minimum_score: 0.60
  w_position: 0.4
  w_view: 0.4
  w_waypoint: 0.0
  w_distance: 0.2
  ideal_standoff_m: 15.0
  max_standoff_m: 40.0

matching:
  temporal_neighbor_count: 4
  max_gps_distance_m: 20
  max_view_angle_delta_deg: 20

loftr:
  pretrained: outdoor
  min_confidence: 0.50
  max_image_side: 1024

geometry:
  min_matches: 50
  min_inliers: 30
  min_inlier_ratio: 0.20
  max_median_reprojection_error_px: 3.0
  ransac_reproj_threshold_px: 4.0

stitch:
  generate_analysis_mosaic: true
  generate_visual_mosaic: true
  analysis_feather_blend: false
  visual_multiband_blend: true
  multiband_num_bands: 5

colmap:
  enabled: true
  mode: fallback
  max_drift_px: 10.0
  max_seam_drift_px: 20.0
  max_coverage_gap_ratio: 0.5

tiling:
  tile_width: 1024
  tile_height: 1024
  overlap_px: 128
  skip_if_observed_ratio_below: 0.5

crack:
  model: runs/segment/training/crack_seg/runs/baseline2/weights/best.pt
  confidence: 0.25
  min_polygon_area_px: 15

measurement:
  require_calibration_for_mm: true
