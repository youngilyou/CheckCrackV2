# Phase 1 (Single Facade Offline PoC) pipeline configuration.
# Sections mirror CLAUDE.local.md #33. Only keys consumed by the current
# implementation are here; later phases add their own sections.

project:
  building_id: B001

facade_segmentation:
  merge_if_normal_angle_delta_deg: 8
  split_if_normal_angle_delta_deg: 15
  min_segment_length_m: 2.0

facade_assignment:
  max_camera_to_target_angle_deg: 25
  corner_duplicate_angle_deg: 35
  minimum_score: 0.60
  w_position: 0.4
  w_view: 0.4
  w_waypoint: 0.0  # no mission/waypoint DB yet; see facade_classifier.py docstring
  w_distance: 0.2
  ideal_standoff_m: 15.0
  max_standoff_m: 40.0

matching:
  temporal_neighbor_count: 4
  max_gps_distance_m: 20
  max_view_angle_delta_deg: 20

loftr:
  pretrained: outdoor
  min_confidence: 0.50
  max_image_side: 1024  # LoFTR inference-only downscale; matches are rescaled back to original resolution
  pair_timeout_s: 60  # a single pair (e.g. extreme repetitive-pattern content) exceeding this is killed and marked MATCH_TIMEOUT instead of stalling the whole facade

geometry:
  min_matches: 50
  min_inliers: 30
  min_inlier_ratio: 0.35
  max_median_reprojection_error_px: 3.0
  ransac_reproj_threshold_px: 4.0

stitch:
  generate_analysis_mosaic: true
  generate_visual_mosaic: true
  analysis_feather_blend: false
  visual_multiband_blend: true
  multiband_num_bands: 5

colmap:
  enabled: true
  mode: fallback
  max_drift_px: 10.0
  max_seam_drift_px: 20.0  # single worst seam — a facade can pass the *mean* drift check while one bad seam still produces a visible wavy/misaligned line
  max_coverage_gap_ratio: 0.5

tiling:
  tile_width: 1024
  tile_height: 1024
  overlap_px: 128
  skip_if_observed_ratio_below: 0.5

crack:
  model: runs/segment/training/crack_seg/runs/baseline2/weights/best.pt
  confidence: 0.25
  min_polygon_area_px: 15  # drop speck noise below this at tile resolution

measurement:
  require_calibration_for_mm: true
  crack_width_threshold_mm: 0.3  # 건설 크랙검사 기준 (0.2mm 기준은 채택 안 함); calibration 없으면 severity 자체를 매기지 않음
  crack_id_match_iou_threshold: 0.3  # 같은 스티칭 버전 재검사 시 이전 crack_id 유지 판단 IoU 기준 (재스티칭 후에는 적용 안 됨)
  source_observation_min_overlap_px: 20  # 이 픽셀 수 미만으로 소유한 source image는 source_observations 후보에서 제외 (노이즈성 겹침 필터)

# 원본 단위 Crack 검출 -> Facade 좌표 투영 -> Duplicate/Continuation 통합 (crack/multiview.py).
# SmartCrack V2 설계안 검토, 2026-08-26 확정: 아래 threshold는 전부 초기 검증 기준이며,
# 실제 DJI/Matrice 외벽 촬영 데이터와 Ground Truth 기반 성능평가 후 최종 확정한다.
# (지금 값으로 실행하면 값은 나오지만, 실측 데이터 확보 전까지는 참고용 수치로만 취급할 것.)
# 그림자/조명 보정 (src/illumination/correction.py). MODE 0/1/2는 같은 classical
# Retinex-lite 알고리즘을 강도만 다르게 적용한 것 -- "어떤 알고리즘이 이기는가"가
# 아니라 "보정을 얼마나 세게 하는 게 적당한가"를 실측으로 비교하기 위함.
# NOTE: 아래 값도 초기 검증 기준이며, 실제 촬영 데이터로 A/B 비교 후 확정한다.
illumination:
  # 2026-08-26 1차 마무리: RETINEX와 PHASR(그림자 영역 한정 블렌딩) 둘 다 확정.
  # 기본값은 RETINEX(추가 모델/GPU 불필요) -- PHASR은 필요할 때 명시적으로 켬.
  mode: RETINEX  # ORIGINAL | LIGHT | RETINEX | PHASR
  light_kernel_frac: 0.15       # 이미지 짧은 변 대비 Gaussian blur 커널 크기 비율
  light_correction_min: 0.85
  light_correction_max: 1.25
  light_max_blend_strength: 0.4  # 그림자 영역에서도 보정을 약하게만 적용
  retinex_kernel_frac: 0.25
  retinex_correction_min: 0.6
  retinex_correction_max: 1.8
  retinex_max_blend_strength: 0.9  # 그림자 영역은 거의 완전히 보정

  # PhaSR (src/illumination/phasr_wrapper.py) -- 전체 이미지 blending이 아니라
  # "그림자 영역에만, 약하게" 적용(사용자 확정 2026-08-26):
  #   weight = shadow_darkness_mask_local(...) * phasr_blend_strength
  #   result = original*(1-weight) + phasr(tiled)*weight
  # 타일링(OOM 회피)과 국소 대비 기반 그림자 마스크(전역 평균 기반 마스크는 얇은
  # 캐스트 그림자를 거의 못 잡음, 실측으로 확인) 필요. 나무/식생 오탐은 아직
  # 미해결(1차 마무리 범위 밖, 추후 개선 대상).
  phasr_tile_size: 768
  phasr_overlap: 96
  phasr_shadow_fine_kernel_frac: 0.005
  phasr_shadow_coarse_kernel_frac: 0.06
  phasr_shadow_gain: 4.0
  phasr_blend_strength: 1.0

# 원본(ORIGINAL, 보정 없음)을 기본 검출로 두고, 강한 그림자 때문에 검출이 어려운
# ROI만 골라서 RETINEX -> PhaSR 순으로 선택적 재검출하는 방식 (사용자 확정,
# 2026-08-26). src/crack/shadow_recovery.py.
shadow_recovery:
  # ROI 정의 = "그림자 자체"가 아니라 "그림자 때문에 검출이 어려운 곳"(사용자 확정,
  # 2026-08-26). 단순 밝기/대비 기반 그림자 마스크만 쓰면 발코니 핀처럼 반복되는
  # 건축 그림자 패턴이 있는 사진에서 ROI가 사실상 이미지 전체로 수렴함(실측 확인 --
  # threshold를 0.95까지 올려도 병합 후 전체 면적의 ~100%가 나옴). 대신: 신뢰도를
  # 낮춰서 다시 검출했을 때만 나오는 "near-miss" 후보 중, 이미 confident하게 검출된
  # 것과 안 겹치고 + 실제 그림자 영역에 있는 것만 ROI로 취급 -- 훨씬 좁고 구체적인
  # ROI가 나옴.
  low_confidence_scale: 0.5  # near-miss 재검출 시 cfg.crack.confidence에 곱하는 배율
  roi_threshold: 0.3         # near-miss 후보 중심점의 shadow_darkness_mask_local 값이 이 이상이어야 ROI로 인정
  roi_padding_px: 40         # ROI bbox 여유(잘린 크랙 문맥 보존)
  roi_merge_gap_px: 60       # 이 거리 이내로 가까운/겹치는 ROI는 하나로 병합(개수 축소)
  # 여러 near-miss가 한 곳에 몰려서 ROI가 커지는 경우에 대비한 안전장치 -- 이 비율을
  # 넘으면 통째로 처리하지 않고 격자로 잘라서 처리(건너뛰지 않음, #8/#21 타일링 원칙).
  roi_max_area_fraction: 0.15

multiview:
  duplicate_iou_threshold: 0.15  # 서로 다른 원본에서 같은 크랙 전체를 중복 검출한 경우 (1차 구현: geometric overlap만; 방향/형상 유사도는 2차 고도화)
  duplicate_max_center_distance_px: 40.0  # IoU가 기준 미만이어도 중심 거리가 이 이내면 duplicate 후보로 봄
  continuation_max_gap_px: 60.0  # 겹치지 않는 두 원본 경계에서 갈라진 크랙의 끝점 사이 최대 허용 gap
  continuation_max_tangent_angle_deg: 25.0  # 두 끝점 접선 방향과 연결선 방향의 최대 허용 각도차
  continuation_tangent_window_px: 25.0  # 끝점 접선을 추정할 때 skeleton을 따라 안쪽으로 걷는 대략적 거리
