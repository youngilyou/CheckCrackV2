# Phase 1 (Single Facade Offline PoC) pipeline configuration.
# Sections mirror CLAUDE.local.md #33. Only keys consumed by the current
# implementation are here; later phases add their own sections.

project:
  building_id: B001

facade_segmentation:
  merge_if_normal_angle_delta_deg: 8
  split_if_normal_angle_delta_deg: 15
  min_segment_length_m: 2.0

facade_assignment:
  max_camera_to_target_angle_deg: 25
  corner_duplicate_angle_deg: 35
  minimum_score: 0.60
  w_position: 0.4
  w_view: 0.4
  w_waypoint: 0.0  # no mission/waypoint DB yet; see facade_classifier.py docstring
  w_distance: 0.2
  ideal_standoff_m: 15.0
  max_standoff_m: 40.0

matching:
  temporal_neighbor_count: 4
  max_gps_distance_m: 20
  max_neighbors_per_image: 16  # nearest neighbors kept per image (3D GPS); 0/absent = old radius-only behavior
  max_view_angle_delta_deg: 20

loftr:
  pretrained: outdoor
  min_confidence: 0.50
  max_image_side: 1024  # LoFTR inference-only downscale; matches are rescaled back to original resolution
  pair_timeout_s: 60  # a single pair (e.g. extreme repetitive-pattern content) exceeding this is killed and marked MATCH_TIMEOUT instead of stalling the whole facade

geometry:
  min_matches: 50
  min_inliers: 30
  min_inlier_ratio: 0.35
  max_median_reprojection_error_px: 3.0
  ransac_reproj_threshold_px: 4.0

stitch:
  generate_analysis_mosaic: true
  generate_visual_mosaic: true
  analysis_feather_blend: false
  visual_multiband_blend: true
  multiband_num_bands: 5
  max_chain_weight: 12.0  # cumulative 1/inlier_ratio cost (Dijkstra) beyond which a node is excluded rather than composed through untrustworthy matches -- needs real-world tuning, not yet measured against production data

colmap:
  enabled: true
  mode: fallback
  max_drift_px: 10.0
  max_seam_drift_px: 20.0  # single worst seam — a facade can pass the *mean* drift check while one bad seam still produces a visible wavy/misaligned line
  max_coverage_gap_ratio: 0.5
  use_loftr_matching: true  # SIFT(match_exhaustive)를 LoFTR로 대체 (src/matching/loftr_colmap_bridge.py) -- 반복 패턴(창/환기구/발코니 패널) 오정합 근본 해결책. 2026-09-17 최초 확정, 2026-09-24 재확인: FRONT facade(422장) 기준 SuperPoint+LightGlue보다도 등록률/재투영오차 우수, 라이선스도 깨끗함(Apache 2.0). 이 설정은 09-13 baseline 되돌리기로 잠시 유실됐다가 이번에 재적용.
  use_dense_stereo: true  # COLMAP dense stereo(patch_match_stereo+stereo_fusion, pycolmap 순수 호출) + 같은 평면 flat mosaic hole-fill 하이브리드 (src/geometry/dense_stereo.py) -- 2026-09-23/24 gsplat3d PoC에서 검증, flat 단독의 발코니/돌출부 왜곡을 해결. 면 하나당 여러 시간(dense stereo 자체가 수 시간) 추가 소요 -- 2026-09-24 사용자 확정("UI와 모두 연결"): 시간보다 정확성 우선.
  # 2026-10-06 (데이터 관리): Dense 결과/깊이 사이드카까지 전부 저장된 뒤 이후 아무것도 읽지 않는 중간 파일 삭제
  # (normal_maps, photometric 깊이 맵, fused.ply.vis, 왜곡 보정 사진 -- FRONT 기준 69 GB -> 약 11 GB).
  # 남는 것: geometric 깊이 맵 + sparse + fused.ply (크랙 깊이 배치/클릭 위치/깊이 재샘플용). 디버깅으로 융합만 다시
  # 돌려야 할 때만 false. 기존 실행 폴더 정리: tools/cleanup_dense_intermediates.py
  dense_cleanup_intermediate: true
  # 2026-10-08: Dense patch_match 속도/품질 설정 (전체 시간의 약 84%). 기본값 = 기존 동작.
  # 20장 실측: 1600 px -> 44% 단축, 1600 px + 반복 3회 -> 65% 단축, 깊이 차이 중앙값 < 0.05%.
  # 2026-10-08 사용자 확정: 1600 px + 3회 채택 (수목토 BACK 전체 절차 6h33m -> 3h13m, 크랙 결과 동등, 모서리 개선, 질감 약간 부드러움).
  # 실제 드론 촬영 자료로 다시 검증 예정 -- 문제 있으면 2640 / 5 (기존 값)로 되돌린다.
  dense_max_image_size: 1600
  dense_num_iterations: 3
  # 2026-09-26: 촬영 위치(GPS)가 한 줄로 늘어선 촬영(예: LEFT -- 드론이 벽을 따라 수직으로 오르내림)은 평평한 벽 +
  # 좁은 이동이라 COLMAP이 사진마다 초점거리를 따로 최적화하다 재구성이 휜다(LEFT 실측: 한 카메라의 초점거리가
  # 581~18642 px로 흩어짐, FRONT는 3730~3835 px). single_camera: auto(기본) = 그런 촬영일 때만 카메라 하나를
  # 공유하고 아래 known_intrinsics로 내부 파라미터를 고정, true = 항상, false = 끔. FRONT/BACK은 auto에서
  # 영향 없음. 이 카메라 기종의 값이 없으면 기존 동작 그대로(GPS/짐벌 자세 기반 대체 보정으로 떨어짐).
  single_camera: auto
  known_intrinsics:
    # 출처: FRONT V009 COLMAP 1단계(422장, 사진별 카메라 최적화)의 중앙값 -- focal 3789.27, cx/cy는 이미지 중심,
    # k1 중앙값 0.0004 (p5 -0.0014 ~ p95 0.0022). 같은 카메라 기종/해상도에서만 쓰인다.
    L2D-20c:
      width: 5280
      height: 3956
      focal_px: 3789.27
      k1: 0.0004
  # matcher_backend: "sift" | "loftr" | "hloc" -- 2026-09-24, Viewer 설정 화면의 매칭 알고리즘
  # 콤보박스가 매 실행마다 --matcher-backend로 이 값을 오버라이드한다(Config.set_override,
  # src/pipeline/runner.run_facade_poc). 이 키 자체를 여기 두지 않으면(주석 처리 상태 유지)
  # 위 use_loftr_matching 불리언이 계속 기본 결정권을 가짐 -- src/sfm/colmap_runner.run_colmap의
  # docstring이 정확한 우선순위를 설명함. "hloc"은 SuperPoint+LightGlue를 별도 env
  # (D:/ClaudePr/CheckCrack3D/nerfstudio/hloc_env, src/matching/hloc_bridge.py) subprocess로
  # 실행 -- 사용자 명시 요청으로 라이선스(Magic Leap 비상업) 고려 없이 비교용으로 추가됨.
  # matcher_backend: loftr

# 실행 트랙 (2026-09-25):
#   reference  = gsplat3d/render_dense_stereo_loftr 절차 그대로 (현재 값). COLMAP 1단계(LoFTR, 전체 이미지) -> flat 모자이크(전체
#                이미지, 평면 캔버스 그대로) -> Dense Stereo(전체 이미지) -> 참조와 같은 병합. **이미지 필터 없음**, H체인/COLMAP
#                2단계 없음, 가장자리 마진 없음. (사용자: "Colmap->이미지 필터->LoFTR->Dense Stereo 이것 버리고 render_dense_stereo_loftr
#                이것의 실행 로직을 적용" -- V007에서 필터가 이미지 152장을 제외해 위쪽 파라펫/왼쪽 면이 어긋나고 구멍이 생김)
#   dense_only = COLMAP 1단계 -> 벽면 미노출 이미지 필터 -> Dense Stereo (V007 방식, 위 문제 때문에 비권장)
#   full       = COLMAP 1단계 -> 필터 -> H체인 -> COLMAP 2단계 -> Dense Stereo (키가 없을 때의 기본값)
# reference/dense_only 결과물: *_colmap_dense.* + 크랙 검사/뷰어가 읽는 *_colmap.* 사이드카(_scale_colmap, _wall_region_mask_colmap,
# _colmap_report, _source_images). H체인 산출물(_analysis.tif/_visual.tif/_quality_report.json)은 만들어지지 않음.
# reference/dense_only는 colmap.use_dense_stereo 값과 무관하게 Dense Stereo를 실행함(이 트랙의 존재 이유이므로).
pipeline:
  track: reference

tiling:
  tile_width: 1024
  tile_height: 1024
  overlap_px: 128
  skip_if_observed_ratio_below: 0.5

crack:
  # 1차 (모든 크랙 표시) -- 원본 baseline2 그대로, 창틀/판넬이음새/건물모서리 등도 크랙 후보로 표시.
  # 2026-09-13: training/crack_seg/models/v1_all_cracks/에 안정 경로로 재배치 (가중치 파일 자체는 동일).
  model: training/crack_seg/models/v1_all_cracks/best.pt
  # 2차 (구조물 오탐 제외) -- 1차와 별개의 학습 산출물. 358개 확정 오탐(창틀/판넬이음새/건물모서리 등,
  # training_data_structural_fp_v2/) + crack512 실제 양성 4916장을 섞어 파인튜닝
  # (training/crack_seg/finetune_hard_negatives_full_positive.py) -- 하드네거티브만으로는 실제
  # crack recall이 떨어져서(catastrophic forgetting, CLAUDE.local.md 2026-09-13 기록 참고) 양성
  # 데이터를 반드시 함께 섞어야 함. 실측: crack512 held-out 546장 기준 mAP50 box 0.692->0.704,
  # mask 0.521->0.540 (개선), BACK 68장 재검출 시 오탐 499개->58개(-91%).
  # detect_cracks_folder.py가 1차/2차 둘 다 항상 돌려서 {facade_id}_cracks.json(1차)/
  # {facade_id}_cracks_v2.json(2차)로 각각 저장 -- 최종 채택 여부는 3차(육안 검토, 운영자)가 판단.
  model_v2: training/crack_seg/models/v2_exclude_structural_fp/best.pt
  confidence: 0.25
  min_polygon_area_px: 15  # drop speck noise below this at tile resolution

measurement:
  require_calibration_for_mm: true
  crack_width_threshold_mm: 0.3  # 건설 크랙검사 기준 (0.2mm 기준은 채택 안 함); calibration 없으면 severity 자체를 매기지 않음
  # 2026-10-05: 0.3mm 등급은 그 크랙 위치의 원본 해상도가 이 값(mm/px) 이하일 때만 매긴다.
  # 0.15 = 0.3mm 크랙이 최소 2px에 걸치는 해상도. 현재 촬영(약 2.6 mm/px)은 전부 "판정불가(해상도부족)".
  # 0.3mm 판정에는 크랙 후보 근접 촬영(목표 약 0.1 mm/px) + 폭을 아는 게이지/시편 Ground Truth 검증이 필요.
  # 본 값은 초기 검증 기준이며, 실제 DJI/Matrice 외벽 촬영 데이터와 Ground Truth 기반 성능평가 후 최종 확정한다.
  max_mm_per_px_for_severity: 0.15
  crack_id_match_iou_threshold: 0.3  # 같은 스티칭 버전 재검사 시 이전 crack_id 유지 판단 IoU 기준 (재스티칭 후에는 적용 안 됨)
  source_observation_min_overlap_px: 20  # 이 픽셀 수 미만으로 소유한 source image는 source_observations 후보에서 제외 (노이즈성 겹침 필터)

# 원본 단위 Crack 검출 -> Facade 좌표 투영 -> Duplicate/Continuation 통합 (crack/multiview.py).
# SmartCrack V2 설계안 검토, 2026-08-26 확정: 아래 threshold는 전부 초기 검증 기준이며,
# 실제 DJI/Matrice 외벽 촬영 데이터와 Ground Truth 기반 성능평가 후 최종 확정한다.
# (지금 값으로 실행하면 값은 나오지만, 실측 데이터 확보 전까지는 참고용 수치로만 취급할 것.)
# 그림자/조명 보정 (src/illumination/correction.py). MODE 0/1/2는 같은 classical
# Retinex-lite 알고리즘을 강도만 다르게 적용한 것 -- "어떤 알고리즘이 이기는가"가
# 아니라 "보정을 얼마나 세게 하는 게 적당한가"를 실측으로 비교하기 위함.
# NOTE: 아래 값도 초기 검증 기준이며, 실제 촬영 데이터로 A/B 비교 후 확정한다.
illumination:
  # 2026-08-26 1차 마무리: RETINEX와 PHASR(그림자 영역 한정 블렌딩) 둘 다 확정.
  # 기본값은 RETINEX(추가 모델/GPU 불필요) -- PHASR은 필요할 때 명시적으로 켬.
  mode: RETINEX  # ORIGINAL | LIGHT | RETINEX | PHASR
  light_kernel_frac: 0.15       # 이미지 짧은 변 대비 Gaussian blur 커널 크기 비율
  light_correction_min: 0.85
  light_correction_max: 1.25
  light_max_blend_strength: 0.4  # 그림자 영역에서도 보정을 약하게만 적용
  retinex_kernel_frac: 0.25
  retinex_correction_min: 0.6
  retinex_correction_max: 1.8
  retinex_max_blend_strength: 0.9  # 그림자 영역은 거의 완전히 보정

  # PhaSR (src/illumination/phasr_wrapper.py) -- 전체 이미지 blending이 아니라
  # "그림자 영역에만, 약하게" 적용(사용자 확정 2026-08-26):
  #   weight = shadow_darkness_mask_local(...) * phasr_blend_strength
  #   result = original*(1-weight) + phasr(tiled)*weight
  # 타일링(OOM 회피)과 국소 대비 기반 그림자 마스크(전역 평균 기반 마스크는 얇은
  # 캐스트 그림자를 거의 못 잡음, 실측으로 확인) 필요. 나무/식생 오탐은 아직
  # 미해결(1차 마무리 범위 밖, 추후 개선 대상).
  phasr_tile_size: 768
  phasr_overlap: 96
  phasr_shadow_fine_kernel_frac: 0.005
  phasr_shadow_coarse_kernel_frac: 0.06
  phasr_shadow_gain: 4.0
  phasr_blend_strength: 1.0

# 원본(ORIGINAL, 보정 없음)을 기본 검출로 두고, 강한 그림자 때문에 검출이 어려운
# ROI만 골라서 RETINEX -> PhaSR 순으로 선택적 재검출하는 방식 (사용자 확정,
# 2026-08-26). src/crack/shadow_recovery.py.
shadow_recovery:
  # ROI 정의 = "그림자 자체"가 아니라 "그림자 때문에 검출이 어려운 곳"(사용자 확정,
  # 2026-08-26). 단순 밝기/대비 기반 그림자 마스크만 쓰면 발코니 핀처럼 반복되는
  # 건축 그림자 패턴이 있는 사진에서 ROI가 사실상 이미지 전체로 수렴함(실측 확인 --
  # threshold를 0.95까지 올려도 병합 후 전체 면적의 ~100%가 나옴). 대신: 신뢰도를
  # 낮춰서 다시 검출했을 때만 나오는 "near-miss" 후보 중, 이미 confident하게 검출된
  # 것과 안 겹치고 + 실제 그림자 영역에 있는 것만 ROI로 취급 -- 훨씬 좁고 구체적인
  # ROI가 나옴.
  low_confidence_scale: 0.5  # near-miss 재검출 시 cfg.crack.confidence에 곱하는 배율
  roi_threshold: 0.3         # near-miss 후보 중심점의 shadow_darkness_mask_local 값이 이 이상이어야 ROI로 인정
  roi_padding_px: 40         # ROI bbox 여유(잘린 크랙 문맥 보존)
  roi_merge_gap_px: 60       # 이 거리 이내로 가까운/겹치는 ROI는 하나로 병합(개수 축소)
  # 여러 near-miss가 한 곳에 몰려서 ROI가 커지는 경우에 대비한 안전장치 -- 이 비율을
  # 넘으면 통째로 처리하지 않고 격자로 잘라서 처리(건너뛰지 않음, #8/#21 타일링 원칙).
  roi_max_area_fraction: 0.15

multiview:
  duplicate_iou_threshold: 0.15  # 서로 다른 원본에서 같은 크랙 전체를 중복 검출한 경우 (1차 구현: geometric overlap만; 방향/형상 유사도는 2차 고도화)
  duplicate_max_center_distance_px: 40.0  # IoU가 기준 미만이어도 중심 거리가 이 이내면 duplicate 후보로 봄
  continuation_max_gap_px: 60.0  # 겹치지 않는 두 원본 경계에서 갈라진 크랙의 끝점 사이 최대 허용 gap
  continuation_max_tangent_angle_deg: 25.0  # 두 끝점 접선 방향과 연결선 방향의 최대 허용 각도차
  continuation_tangent_window_px: 25.0  # 끝점 접선을 추정할 때 skeleton을 따라 안쪽으로 걷는 대략적 거리

# 2026-10-09: 보고서 발행처 (표지 "발행처" + 마지막 장 결재란 왼쪽). 기본은 ERP의 MySQL CompanySettings(뷰어 "DB 설정" 필요)에서
# 가져오고, 여기 값은 DB를 못 읽을 때의 대체값(항목별). 둘 다 없으면 "미등록".
report:
  issuer:
    company: ""        # 회사명
    business_no: ""    # 사업자등록번호 (비우면 줄 자체를 표시 안 함)
    address: ""        # 주소
    phone: ""          # 대표 연락처
    email: ""          # 이메일 (선택)
